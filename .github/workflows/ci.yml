name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh + bats
        run: sudo apt-get update && sudo apt-get install -y zsh bats
      - name: zsh parse check + bats
        run: |
          ./bin/dotfiles check || true   # shellcheck/zshellcheck may be absent; zsh -n is the floor
          bats test
