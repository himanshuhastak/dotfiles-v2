# Generic SSH defaults — Host * must be last in the Include chain.
# Machine-specific hosts: local/profile/ssh.local → ~/.ssh/config.d/local.conf

Host *
  # No User line — OpenSSH defaults to your local login name ($USER).
  # OpenSSH 8.x does not expand ${USER} or %u in User; override per host in ssh.local.
  # Override User per machine in local/profile/ssh.local if needed.

  # --- Keep-alive (idle SSH / Cursor Remote disconnects) ---
  ServerAliveInterval 30
  ServerAliveCountMax 6
  TCPKeepAlive yes

  # Helps on some corporate VPNs / firewalls (try IPQoS none if drops persist)
  IPQoS throughput

  # --- Connection reliability ---
  ConnectTimeout 30
  ConnectionAttempts 3

  # --- X11 forwarding (remote GUI apps; xauth fix runs on zsh login) ---
  ForwardX11 yes
  ForwardX11Trusted yes

  # --- Auth / keys ---
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_ed25519
  IdentityFile ~/.ssh/id_rsa
  AddKeysToAgent yes

  # --- Security ---
  StrictHostKeyChecking accept-new
  HashKnownHosts yes

  # --- Multiplexing (faster repeat connections) ---
  ControlMaster auto
  ControlPath ~/.ssh/sockets/%r@%h-%p
  ControlPersist 10m

  # VNC / custom LocalForward: put in local/profile/ssh.local (not here).
  # Host * LocalForward binds one local port for every connection — conflicts
  # if you ssh to multiple hosts. Use host aliases or patterns in ssh.local.
