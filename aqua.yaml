---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
# aqua — declarative CLI installs (rootless). Replaces most of config/tools.toml + install/tools/*.sh
# https://aquaproj.github.io/
#
# Install:  aqua install -a          (via ./install.sh or dotfiles update-tools)
# Optional: aqua install -a -t optional
# Update:   aqua update-aqua && aqua up
#
# Not in aqua (still install/tools/*.sh): zsh, rust, bash, blesh, broot, parallel,
# task, timew, betterleaks, oc-rsync, zshellcheck, dotfiles-tools, bugwarrior
# (betterleaks IS in the aqua-registry now, but not yet at the pinned registry
# ref below — v4.338.0 predates it. Revisit once that ref is bumped.)
# Fonts: bundled under nerdfonts/ — installed locally, never re-downloaded.

checksum:
  # GitHub API rate limits break checksum fetches on shared/CI hosts without a token.
  # Set enabled: true and export GITHUB_TOKEN (or AQUA_GITHUB_TOKEN) when you can.
  enabled: false
  require_checksum: false

registries:
  - type: standard
    ref: v4.338.0 # renovate: depName=aquaproj/aqua-registry

packages:
  # Core — chezmoi is legacy musl (install/tools/chezmoi.sh): aqua's standard
  # build is glibc and fails on RHEL 8 (needs GLIBC_2.32+; host has 2.28).
  - name: rossmacarthur/sheldon@0.8.5

  # Shell init hooks
  - name: junegunn/fzf@v0.74.1
  - name: atuinsh/atuin@v18.17.1
  - name: ajeetdsouza/zoxide@v0.10.0
  - name: direnv/direnv@v2.37.1
  - name: starship/starship@v1.26.0

  # Everyday CLIs
  - name: sharkdp/bat@v0.26.1
  - name: theryangeary/choose@v1.3.7
  - name: dandavison/delta@0.19.2
  - name: muesli/duf@v0.9.1
  - name: bootandy/dust@v1.2.4
  - name: eza-community/eza@v0.23.5
  - name: sharkdp/fd@v10.4.2
  - name: dundee/gdu@v5.36.1
  - name: casey/just@1.57.0
  - name: jesseduffield/lazygit@v0.63.1
  - name: dalance/procs@v0.14.12
  - name: BurntSushi/ripgrep@15.2.0
  - name: chmln/sd@v1.1.0
  - name: tldr-pages/tlrc@v1.13.1
  - name: zellij-org/zellij@v0.44.3
  - name: jqlang/jq@jq-1.8.2
  - name: mikefarah/yq@v4.53.3

  # Quality / CI
  - name: koalaman/shellcheck@v0.11.0
  - name: mvdan/sh@v3.13.1 # shfmt
  - name: rhysd/actionlint@v1.7.12
  - name: editorconfig-checker/editorconfig-checker@v3.8.0
  - name: bats-core/bats-core@v1.14.0
  - name: sharkdp/hyperfine@v1.20.0
  - name: charmbracelet/glow@v2.1.2
  - name: ducaale/xh@v0.26.2
  - name: watchexec/watchexec@v2.5.1

  # Optional (install with: aqua install -t optional  or  --with-optional-tools)
  - name: svenstaro/miniserve
    version: v0.35.0
    tags: [optional]
  - name: kdheepak/taskwarrior-tui
    version: v0.27.0
    tags: [optional]
